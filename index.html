<!doctype html>
<html lang="es">
<head>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Finanzas hogar</title>
<style>
:root{
  --ink:#15201f;--ink2:#2c3a38;--paper:#f3efe6;--card:#fbfaf6;
  --line:#ddd6c7;--muted:#7c857f;
  --pine:#1f5d4c;--pine-s:#e2efe7;--gold:#c98a2b;--gold-s:#f6e9d2;
  --clay:#c0512f;--clay-s:#f7ddd2;--blue:#3f6791;
  --sh:0 1px 0 rgba(0,0,0,.04),0 8px 24px -16px rgba(21,32,31,.28);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);overscroll-behavior:none;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:540px;margin:0 auto;padding:0 14px 96px}
header{position:sticky;top:0;z-index:20;max-width:540px;margin:0 auto;padding:14px 14px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--paper);border-bottom:1px solid var(--line)}
.brand{font-size:20px;font-weight:800;letter-spacing:-.5px}.brand b{color:var(--pine)}
.mrow{display:flex;align-items:center;gap:4px;background:var(--pine);border-radius:12px;padding:3px}
.mrow span{font-size:15px;font-weight:800;color:#fff;min-width:120px;text-align:center;letter-spacing:-.2px;text-transform:capitalize}
.mrow button{border:none;background:rgba(255,255,255,.15);color:#fff;font-size:18px;line-height:1;cursor:pointer;padding:7px 12px;border-radius:9px}
.mrow button:active{background:rgba(255,255,255,.35)}
.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--ink);display:flex;align-items:center;
  z-index:30;padding:0 4px env(safe-area-inset-bottom,4px);height:66px}
.tabs button{flex:1;border:none;background:none;color:#8aa0a0;padding:6px 0;font-size:10.5px;font-weight:700;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tabs button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button span{font-size:10.5px}
.tabs button.on{color:#fff}
.tabs button.fab svg{width:24px;height:24px;background:var(--gold);color:#fff;border-radius:50%;padding:11px;
  box-sizing:content-box;stroke-width:2.6;box-shadow:0 4px 12px -2px rgba(201,138,43,.6)}
.tabs button.fab span{color:var(--gold)}
.tabs button.fab.on svg{background:var(--clay);box-shadow:0 4px 12px -2px rgba(192,81,47,.6)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0;box-shadow:var(--sh)}
.ct{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:12px}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{border-radius:14px;padding:12px 14px;border:1px solid var(--line);background:#fff}
.pill .who{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.pill .big{font-size:21px;font-weight:800;letter-spacing:-.5px;margin:3px 0 2px}
.pill .sub{font-size:12px;font-weight:700}
.pos{color:var(--pine)}.neg{color:var(--clay)}.amber{color:var(--gold)}
.meter{margin:12px 0}
.meter .mh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.meter .ml{font-size:13px;font-weight:700}.meter .mv{font-size:12px;font-weight:600;color:var(--muted)}
.track{height:10px;background:#eee7da;border-radius:99px;overflow:hidden}
.fill{height:100%;border-radius:99px;transition:width .4s ease}
.m-ok .fill{background:var(--pine)}.m-warn .fill{background:var(--gold)}.m-over .fill{background:var(--clay)}
.mf{font-size:11.5px;font-weight:600;margin-top:4px}
.m-ok .mf{color:var(--pine)}.m-warn .mf{color:var(--gold)}.m-over .mf{color:var(--clay)}
.tag{font-size:11px;color:var(--muted);font-weight:600}
.banner{border-radius:12px;padding:11px 14px;font-size:13px;font-weight:600;margin:8px 0;line-height:1.45}
.b-red{background:var(--clay-s);color:#7a2a14}.b-amber{background:var(--gold-s);color:#7a4d12}.b-green{background:var(--pine-s);color:#174d3a}
.fg{margin-bottom:14px}
label.lbl{display:block;font-size:12px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
input,select{width:100%;max-width:100%;min-width:0;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:16px;color:var(--ink);font-family:inherit;-webkit-appearance:none;appearance:none}
input[type=date],input[type=month]{min-height:46px;line-height:1.1}
.grid2>div{min-width:0}
input:focus,select:focus{outline:none;border-color:var(--pine);box-shadow:0 0 0 3px var(--pine-s)}
.amt-wrap{position:relative}
.amt-wrap::before{content:'$';position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:20px;font-weight:700;color:var(--muted)}
.amt-wrap input{padding-left:30px;font-size:26px;font-weight:800}
.calcrow{display:flex;gap:8px;margin-top:8px;align-items:center}
.calcrow button{width:46px;padding:8px 0;border:1.5px solid var(--line);background:#fff;border-radius:10px;font-size:17px;font-weight:800;color:var(--ink2);cursor:pointer}
.calcrow button:active{background:var(--paper)}
.calctot{flex:1;text-align:right;font-size:15px;font-weight:800;color:var(--pine);min-height:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.catgrid button{padding:13px 10px;border:1.5px solid var(--line);background:#fff;border-radius:12px;font-size:14px;
  font-weight:700;color:var(--ink2);cursor:pointer;text-align:left}
.catgrid button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:12px;border:1.5px solid var(--line);background:#fff;border-radius:12px;font-size:14px;font-weight:700;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn{display:block;width:100%;padding:15px;border:none;border-radius:13px;background:var(--pine);color:#fff;font-size:16px;font-weight:800;cursor:pointer;margin-top:4px}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:600;font-size:14px;padding:11px}
.xrow{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.xrow:last-child{border-bottom:none}
.dot{width:9px;height:9px;border-radius:99px;flex:none}
.xrow .d{flex:1;font-size:13.5px;font-weight:600;overflow:hidden}
.xrow .d small{display:block;color:var(--muted);font-size:11.5px;font-weight:500}
.xrow .a{font-weight:800;font-size:14px;white-space:nowrap}
.xrow .x{border:none;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:2px 6px}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:13.5px;line-height:1.6}
.cfgrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
.cfgrow:last-child{border-bottom:none}
.cfgrow .k{flex:1;font-size:13px;font-weight:600;color:var(--ink2)}
.cfgrow .k small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.cfgrow input{width:115px;text-align:right;padding:7px 10px;font-size:14px;font-weight:700}
.blk{font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--pine);margin:16px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.blk:first-child{margin-top:0}
.hint{font-size:12px;color:var(--muted);line-height:1.5;margin-top:8px}
.suggest{font-size:11.5px;color:var(--pine);font-weight:700;cursor:pointer}
.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--pine-s);border-top-color:var(--pine);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.bars{display:flex;align-items:flex-end;gap:7px;height:130px;padding-top:8px}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.bars .bar{width:100%;border-radius:6px 6px 0 0;background:var(--pine);min-height:3px;transition:height .4s}
.bars .lab{font-size:10px;color:var(--muted);font-weight:600}
.bars .val{font-size:9.5px;color:var(--ink2);font-weight:700}
.gbars{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:14px}
.gbars .gcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.gbars .pair{display:flex;align-items:flex-end;gap:3px;height:100%;width:100%;justify-content:center}
.gbars .b{width:44%;max-width:15px;border-radius:5px 5px 0 0;min-height:2px;transition:height .4s}
.gbars .b.g{background:var(--clay)}
.gbars .b.a{background:var(--pine)}
.gbars .lab{font-size:10px;color:var(--muted);font-weight:600}
.legend{display:flex;gap:16px;font-size:11.5px;font-weight:600;color:var(--muted);margin:10px 0 2px}
.legend span{display:flex;align-items:center;gap:6px}
.legend .sw{width:11px;height:11px;border-radius:3px;display:inline-block}
.legend .sw.g{background:var(--clay)}.legend .sw.a{background:var(--pine)}
.pill .proj{font-size:11px;font-weight:600;color:var(--muted);margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);line-height:1.3}
.pill .proj b{font-weight:800}
.bars .stack{width:100%;max-width:26px;display:flex;flex-direction:column;justify-content:flex-end;border-radius:6px 6px 0 0;overflow:hidden;min-height:3px}
.bars .stack .seg-l{background:var(--pine);width:100%}
.bars .stack .seg-v{background:var(--gold);width:100%}
.legend .sw.pine{background:var(--pine)}.legend .sw.gold{background:var(--gold)}
.compbar{display:flex;height:26px;border-radius:8px;overflow:hidden;background:#eee7da;margin:6px 0 2px}
.compbar .cseg{height:100%}
.c-fij{background:#5b6b66}.c-tar{background:var(--blue)}.c-var{background:var(--clay)}.c-aho{background:var(--pine)}
.legend .sw.c-fij{background:#5b6b66}.legend .sw.c-tar{background:var(--blue)}.legend .sw.c-var{background:var(--clay)}.legend .sw.c-aho{background:var(--pine)}
.pctpill{color:var(--muted);font-weight:700;font-size:11px;margin-left:5px}
.card.ins{background:linear-gradient(180deg,#fbfaf6,#f7f4ea)}
.card.ins .ct{margin-bottom:2px}
.insight{display:flex;gap:9px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);line-height:1.4;font-size:13.5px}
.insight:first-of-type{border-top:0;padding-top:4px}
.insight .ic{flex:0 0 auto;font-size:14px}
.insight .it{color:var(--ink2)}
.insight.warn .it{color:#9c4526;font-weight:600}
.insight.good .it{color:var(--pine);font-weight:600}
#gate{position:fixed;inset:0;z-index:100;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:24px}
.gatebox{width:100%;max-width:340px;text-align:center;display:flex;flex-direction:column;gap:12px}
.gtitle{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-bottom:2px}.gtitle b{color:var(--pine)}
.gsub{font-size:15px;color:var(--muted);font-weight:600;margin-bottom:8px}
.gbtn{border:none;background:var(--pine);color:#fff;font-size:17px;font-weight:800;padding:16px;border-radius:14px;cursor:pointer;box-shadow:var(--sh)}
.gbtn:active{transform:scale(.98)}
.ginput{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:15px;font-size:22px;text-align:center;letter-spacing:8px;font-weight:800;color:var(--ink)}
.ginput:focus{outline:none;border-color:var(--pine)}
.gerr{color:var(--clay);font-size:13px;font-weight:700;min-height:16px}
.ghint{font-size:12.5px;color:var(--muted);margin-top:6px;cursor:pointer}
.catbar{margin:9px 0}
.catbar .top{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:4px}
.catbar .tr{height:8px;background:#eee7da;border-radius:99px;overflow:hidden}
.catbar .fl{height:100%;border-radius:99px}
.frow{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:none}
.frow .chk{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);background:#fff;color:#fff;font-size:15px;font-weight:800;flex:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.frow.paid .chk{background:var(--pine);border-color:var(--pine)}
.saldo{margin-top:8px;padding:11px 14px;border-radius:14px;background:var(--paper);border:1.5px solid var(--pine)}
.saldo.neg{border-color:var(--clay)}
.saldo .n{font-size:28px;font-weight:800;letter-spacing:-.5px;line-height:1.05}
.saldo .n.pos{color:var(--pine)}.saldo .n.neg{color:var(--clay)}
.saldo .cap{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{padding:6px 10px;border:1.5px solid var(--line);background:#fff;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--ink2);cursor:pointer}
.chip.on{background:var(--pine);color:#fff;border-color:var(--pine)}
.xscroll{max-height:280px;overflow-y:auto;margin:0 -4px;padding:0 4px}
.xscroll::-webkit-scrollbar{width:5px}.xscroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.paychk{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);background:#fff;color:#fff;font-size:14px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none}
.paychk.on{background:var(--pine);border-color:var(--pine)}
.visx{background:none;border:none;font-size:15px;cursor:pointer;flex:none;padding:0 3px;line-height:1}
.frow .fd{flex:1;font-size:13.5px;font-weight:600}
.frow .fd small{display:block;color:var(--muted);font-size:11.5px;font-weight:500}
.frow.paid .fd{color:var(--muted);text-decoration:line-through}
.frow .fa{font-weight:800;font-size:14px}
.ftot{font-size:12px;color:var(--muted);font-weight:700;margin-top:10px;text-align:right}
.fijoedit{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:#fff}
.fijoedit input,.fijoedit select{padding:9px 10px;font-size:14px}
.fijoedit .fe-nombre{width:100%;margin-bottom:6px;font-weight:700}
.fe-line{display:flex;gap:6px;align-items:center;margin-top:6px}
.fe-line .fe-monto{flex:1.4;min-width:0}
.fe-line .fe-dia{width:64px;flex:none;text-align:center}
.fe-line select{flex:1;min-width:0}
.fe-del{border:none;background:none;color:var(--clay);font-size:22px;cursor:pointer;padding:0 6px;flex:none}
.savebar{position:fixed;left:0;right:0;bottom:66px;max-width:540px;margin:0 auto;padding:10px 14px 12px;
  background:linear-gradient(to top, var(--paper) 55%, transparent);z-index:25}
.savebar .btn{margin:0;box-shadow:0 6px 18px -6px rgba(31,93,76,.5)}
#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:99px;font-size:13.5px;font-weight:700;opacity:0;pointer-events:none;transition:all .25s;z-index:50;box-shadow:0 8px 24px -8px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header>
  <div class="brand">Finanzas <b>hogar</b></div>
  <div class="mrow"><button id="prevM">&#8249;</button><span id="mLabel">—</span><button id="nextM">&#8250;</button></div>
</header>
<div class="wrap" id="app"><div class="card" style="text-align:center;padding:40px"><div class="spin"></div></div></div>
<nav class="tabs">
  <button data-tab="board" class="on">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="9" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="10" width="8" height="11" rx="2"/><rect x="3" y="14" width="8" height="7" rx="2"/></svg>
    <span>Tablero</span>
  </button>
  <button data-tab="cuotas">
    <svg viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/></svg>
    <span>Cuotas</span>
  </button>
  <button data-tab="add" class="fab">
    <svg viewBox="0 0 24 24"><line x1="12" y1="6" x2="12" y2="18"/><line x1="6" y1="12" x2="18" y2="12"/></svg>
    <span>Cargar</span>
  </button>
  <button data-tab="dash">
    <svg viewBox="0 0 24 24"><line x1="4" y1="20" x2="4" y2="13"/><line x1="10" y1="20" x2="10" y2="8"/><line x1="16" y1="20" x2="16" y2="11"/><line x1="21" y1="20" x2="3" y2="20"/></svg>
    <span>Evolución</span>
  </button>
  <button data-tab="cfg">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19 13.5a1.5 1.5 0 0 0 .3 1.65l.05.05a1.8 1.8 0 1 1-2.55 2.55l-.05-.05a1.5 1.5 0 0 0-2.55 1.07V19a1.8 1.8 0 1 1-3.6 0v-.1a1.5 1.5 0 0 0-2.55-1.06l-.05.05a1.8 1.8 0 1 1-2.55-2.55l.05-.05A1.5 1.5 0 0 0 5 13.5a1.5 1.5 0 0 0-1.37-.9H3.5a1.8 1.8 0 1 1 0-3.6h.1A1.5 1.5 0 0 0 5 8.05l.05-.05A1.5 1.5 0 0 0 5 5.4l-.05-.05A1.8 1.8 0 1 1 7.5 2.8l.05.05A1.5 1.5 0 0 0 9.2 3.2 1.5 1.5 0 0 0 10.1 1.8V1.7a1.8 1.8 0 1 1 3.6 0v.1a1.5 1.5 0 0 0 .9 1.37 1.5 1.5 0 0 0 1.65-.3l.05-.05a1.8 1.8 0 1 1 2.55 2.55l-.05.05a1.5 1.5 0 0 0-.3 1.65 1.5 1.5 0 0 0 1.37.9h.1a1.8 1.8 0 1 1 0 3.6h-.1a1.5 1.5 0 0 0-1.37.9z"/></svg>
    <span>Mes</span>
  </button>
</nav>
<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycby-G1_5nb98oPPjkVMU8nAjkDynTs4W0azUJ3I_zhQIRwHuaqK5gLyViJNAGIkz8PZbiA/exec'; // ← pegá acá la URL del deployment

const MONTHS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function hoyISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
let curYM=hoyISO().slice(0,7);
let yo=localStorage.getItem('fh_yo')||'';           // identidad de este dispositivo: 'Lautaro' | 'Vanessa'
let unlocked=false;                                  // desbloqueo por PIN (dura la sesión de la pestaña)
const HOGAR_CATS=['Súper','Hogar','Agua','Empleada doméstica','Mascotas']; // sugerencia de "compartido"
const OTRO=()=> yo==='Lautaro'?'Vanessa':'Lautaro';
let tab='board', summary=null, dash=null, cuotas=null, loading=false, netError=false, editStamp=0;
let draft={monto:'',cat:'Comer afuera',quien:(yo||'Lautaro'),medio:'Tarjeta',fecha:hoyISO(),nota:'',vis:'privado'};
let cdraft={descripcion:'',quien:(yo||'Lautaro'),cuota_mensual:'',n_cuotas:'',mes_inicio:curYM,vis:'privado',modo:'total',total:''};
// live: calcula cada cuota a partir del total y la cantidad
function updCuota(){ const t=document.getElementById('cTotal'), n=document.getElementById('cN'), o=document.getElementById('cCadaCuota'); if(!t||!n||!o)return;
  const tot=parseNum(t.value), c=parseInt(n.value)||0; o.textContent = (tot>0&&c>0)? ('Cada cuota: '+fmtd(Math.round(tot/c*100)/100)+' · '+c+' cuotas') : ''; }

const fmt=n=>'$'+Math.round(n||0).toLocaleString('es-AR');
const fmtd=n=>{ n=+n||0; const dec=Math.abs(n%1)>0.005; return '$'+n.toLocaleString('es-AR',{minimumFractionDigits:dec?2:0,maximumFractionDigits:2}); };
function fmtNum(v){const s=String(v).replace(/[^\d]/g,'');return s?parseInt(s,10).toLocaleString('es-AR'):'';}
function parseNum(v){return parseFloat(String(v).replace(/\./g,'').replace(',','.'))||0;}
// ---- Calculadora del campo monto: suma/resta de partes (formato AR) ----
function evalMonto(str){
  const s=String(str==null?'':str).replace(/−/g,'-');   // normaliza el signo "menos" lindo
  const re=/([+\-]?)\s*([\d.,]+)/g; let m, total=0, any=false;
  while((m=re.exec(s))){ const val=parseNum(m[2]); if(!isNaN(val)){ total+=(m[1]==='-'?-1:1)*val; any=true; } }
  return any? total : 0;
}
function esExpr(v){ return /\d\s*[+\-−]/.test(String(v||'')); }   // hay una operación entre números
function amtFocus(el){ if(esExpr(el.value)){ const n=el.value.length; try{el.setSelectionRange(n,n);}catch(e){} } else { try{el.select();}catch(e){} } }
function onAmt(el){ const v=el.value; if(!esExpr(v) && v.indexOf(',')<0) el.value=fmtNum(v); if(typeof draft!=='undefined')draft.monto=el.value; updCalc(); }
function calcOp(op){ const el=document.getElementById('iAmt'); if(!el)return;
  if(op==='C'){ el.value=''; }
  else { const v=el.value.trim().replace(/\s*[+\-−]\s*$/,''); if(!v){ el.focus(); updCalc(); return; } el.value=v+' '+op+' '; }
  if(typeof draft!=='undefined')draft.monto=el.value;
  el.focus(); const n=el.value.length; try{el.setSelectionRange(n,n);}catch(e){}   // cursor al final, NO seleccionar todo
  updCalc();
}
function updCalc(){ const el=document.getElementById('iAmt'), t=document.getElementById('calcTot'); if(!el||!t)return;

// recalcula gastos/ahorro en el cliente (para que el optimismo sea consistente)
// Proyección de ahorro a fin de mes (calculada en el cliente; sirve de respaldo si el backend aún no la manda)
function calcSavingsProj(s){
  if(!s||!s.expenses||s.income===undefined) return null;
  const el=s.elapsed||1, dim=s.dim||30, proj=v=>el?Math.round(v/el*dim):v;
  const miNC=s.expenses.filter(e=>e.quien===s.yo && e.medio!=='Tarjeta').reduce((a,e)=>a+(+e.monto||0),0);
  return s.income - s.miFijos - s.tarjeta - proj(miNC);
}
function recompute(){
  const s=summary; if(!s||!s.expenses) return;
  const mias=s.expenses.filter(e=>e.quien===s.yo);
  const miNC=mias.filter(e=>e.medio!=='Tarjeta').reduce((a,e)=>a+(+e.monto||0),0);
  s.savings = s.income - s.miFijos - s.tarjeta - miNC;
  s.savingsProj = calcSavingsProj(s);
  s.pct = s.income? s.savings/s.income : 0;
  s.tarjetaMes = mias.filter(e=>e.medio==='Tarjeta').reduce((a,e)=>a+(+e.monto||0),0);
}

async function loadAll(){
  const reqStamp=Date.now();
  const c=loadCache(curYM);
  if(c&&c.summary){ summary=c.summary; dash=c.dash||null; cuotas=c.cuotas||null; loading=false; netError=false; render(); }
  else { summary=null; dash=null; cuotas=null; loading=true; netError=false; render(); }
  try{
    const b=await fetchBundle();
    if(editStamp>reqStamp){ loading=false; render(); return; } // hubo edición local mientras cargaba
    summary=b.summary; dash=b.dash; cuotas=b.cuotas;
    loading=false; netError=false; render();
  }catch(e){
    loading=false;
    if(!summary){ netError=true; }   // solo error duro si no hay nada cacheado que mostrar
    render();
  }
}

function meter(label,sp,cap,el,dim,noCap){
  if(noCap){return '<div class="meter m-ok"><div class="mh"><span class="ml">'+label+'</span><span class="mv">'+fmt(sp)+'</span></div><div class="mf" style="color:var(--muted)">Sin tope · se registra para la trazabilidad</div></div>';}
  const r=cap>0?sp/cap:0, pace=el?(sp/el)*dim:sp;
  let c='m-ok',f='Quedan '+fmt(cap-sp);
  if(r>1){c='m-over';f='Te pasaste '+fmt(sp-cap);}
  else if(r>=.75){c='m-warn';f='Quedan '+fmt(cap-sp)+' · al ritmo actual cerrás en '+fmt(pace);}
  return '<div class="meter '+c+'"><div class="mh"><span class="ml">'+label+'</span><span class="mv">'+fmt(sp)+' / '+fmt(cap)+'</span></div><div class="track"><div class="fill" style="width:'+Math.min(r*100,100).toFixed(1)+'%"></div></div><div class="mf">'+f+'</div></div>';
}

// Dinero compacto para textos de avisos: $12k, $1,2M
function kf(n){ n=Math.round(n||0); const a=Math.abs(n);
  if(a>=1000000) return '$'+(n/1000000).toFixed(a>=10000000?0:1).replace('.',',')+'M';
  if(a>=1000) return '$'+Math.round(n/1000)+'k'; return '$'+n; }
function pctT(x){ return Math.round(x*100)+'%'; }

// Mi gasto con tarjeta de crédito acumulado este mes (consumos nuevos, no el pago del resumen)
function cardSpent(s){ const yoq=s&&s.yo; return ((s&&s.expenses)||[]).filter(x=>x.medio==='Tarjeta'&&x.quien===yoq).reduce((a,x)=>a+(+x.monto||0),0); }

// ===== Motor de observaciones (interpretan tus datos + lo compartido) =====
function buildInsights(s,d,c){
  if(!s||!s.isCur) return [];
  const out=[]; const add=(scope,level,text,prio)=>out.push({scope,level,text,prio:prio||0});
  const el=s.elapsed||1, dim=s.dim||30, frac=el/dim; const pj=v=>el?Math.round(v/el*dim):v;
  const yoq=s.yo, ing=s.income||0, t=s.topes||{};
  const mias=(s.expenses||[]).filter(e=>e.quien===yoq);
  const sc=cats=>mias.filter(e=>cats.includes(e.cat)).reduce((a,e)=>a+(+e.monto||0),0);

  // Comer + delivery vs tu tope
  const comer=sc(['Comer afuera','Delivery']);
  if(t.comer>0&&comer>0&&frac>0.15){ const p=pj(comer);
    if(comer>t.comer) add('board','warn','Ya superaste tu tope de comer afuera y delivery ('+kf(comer)+' de '+kf(t.comer)+').',95);
    else if(p>t.comer*1.05) add('board','warn','Vas '+kf(comer)+' en comer afuera y delivery; al ritmo del día '+el+' cerrás en ~'+kf(p)+', arriba del tope de '+kf(t.comer)+'.',80); }
  const deli=sc(['Delivery']);
  if(deli>0&&ing>0&&frac<0.55&&deli>ing*0.03) add('board','warn','Bastante delivery para el día '+el+': ya '+kf(deli)+' ('+pctT(deli/ing)+' de tu ingreso).',70);
  // Salidas
  const sal=sc(['Salidas']);
  if(t.salidas>0&&sal>t.salidas&&frac>0.2) add('board','warn','Pasaste tu tope de salidas ('+kf(sal)+' de '+kf(t.salidas)+').',60);
  // Súper compartido vs tope del hogar
  const superShared=(s.expenses||[]).filter(e=>e.vis==='compartido'&&e.cat==='Súper').reduce((a,e)=>a+(+e.monto||0),0);
  if(t.super>0&&superShared>0&&frac>0.3){ const p=pj(superShared);
    if(superShared>t.super) add('board','warn','El súper del hogar superó el tope ('+kf(superShared)+' de '+kf(t.super)+').',65);
    else if(p>t.super*1.05) add('board','info','El súper del hogar va camino a ~'+kf(p)+' (tope '+kf(t.super)+').',40); }
  // Tarjeta (tu consumo vs tu tope)
  const card=cardSpent(s), topeCard=+(t.tarjeta||0);
  if(card>0){ const p=pj(card);
    if(topeCard>0&&card>topeCard) add('board','warn','Ya gastaste '+kf(card)+' con tarjeta este mes, arriba de tu tope de '+kf(topeCard)+'. Se paga el mes que viene.',90);
    else if(topeCard>0&&p>topeCard*1.05) add('board','warn','Al ritmo actual tu tarjeta cierra en ~'+kf(p)+', arriba de tu tope de '+kf(topeCard)+'. Es plata del mes que viene.',72);
    else add('board','info','Llevás '+kf(card)+' de consumo con tarjeta'+(topeCard>0?' ('+pctT(card/topeCard)+' de tu tope)':'')+'. Se suma al resumen del mes que viene.',35); }
  // Ahorro proyectado (Yo)
  const spj=(s.savingsProj!==undefined?s.savingsProj:calcSavingsProj(s));
  if(spj!==null&&spj!==undefined){ const pr=ing?spj/ing:0;
    if(spj<0) add('board','warn','Vas camino a cerrar el mes en rojo (~'+kf(spj)+'). Conviene frenar el gasto variable.',100);
    else if(pr<0.1) add('board','warn','Tu ahorro proyectado es bajo: ~'+kf(spj)+' ('+pctT(pr)+' de tu ingreso).',75);
    else if(pr>=0.3) add('board','good','Buen ritmo: proyectás ahorrar ~'+kf(spj)+' ('+pctT(pr)+' de tu ingreso).',50); }
  // Mes contra mes (seriesYo)
  if(d&&d.seriesYo&&d.seriesYo.length>=2){ const cur=d.seriesYo[d.seriesYo.length-1], prev=d.seriesYo[d.seriesYo.length-2];
    const gcur=pj(cur.gasto), gprev=prev.gasto;
    if(gprev>0&&frac>=0.33){ const dlt=(gcur-gprev)/gprev;
      if(dlt<-0.15) add('dash','good','Proyectás gastar ~'+pctT(-dlt)+' menos que el mes pasado. Venís frenando.',55);
      else if(dlt>1) add('dash','warn','Al ritmo actual vas camino a gastar más del doble que el mes pasado.',62);
      else if(dlt>0.2) add('dash','warn','Al ritmo actual vas a gastar ~'+pctT(dlt)+' más que el mes pasado.',60); } }
  // Cuotas
  if(c&&c.flujo&&c.flujo.length>=2){ const th=c.flujo[0], nx=c.flujo[1];
    if(th.total>0&&ing>0&&th.total/ing>0.15) add('cuotas','info','Las cuotas que ves se llevan el '+pctT(th.total/ing)+' de tu ingreso este mes ('+kf(th.total)+').',45);
    if(th.total>0&&nx.total>th.total*1.2) add('cuotas','warn','El mes que viene las cuotas suben a '+kf(nx.total)+' (desde '+kf(th.total)+').',58);
    else if(th.total>0&&nx.total<th.total*0.8) add('cuotas','good','El mes que viene las cuotas aflojan: bajan a '+kf(nx.total)+'.',48); }
  // Estacionalidad (Argentina)
  const mo=+(s.ym||curYM).split('-')[1];
  const seas={11:'Estamos en noviembre: ojo con la tarjeta, en diciembre llegan regalos y las Fiestas.',
    12:'Diciembre: llega el aguinaldo, pero también los gastos de Fiestas y regalos. Cuidá la tarjeta.',
    1:'Enero: suelen caer los resúmenes altos de las Fiestas y los gastos de vacaciones.',
    2:'Febrero es corto: el mismo gasto rinde en menos días. En marzo llegan gastos de inicio de año.',
    3:'Marzo: mes de gastos de arranque (colegios, seguros, patentes). Conviene aflojar en el resto.',
    6:'Junio: llega el medio aguinaldo. Buen momento para reforzar el ahorro.',
    7:''};
  if(seas[mo]) add('board', mo===6?'good':'info', seas[mo], 30);
  return out;
}
function insightsCard(scope){
  if(!summary||!summary.isCur) return '';
  const items=buildInsights(summary,dash,cuotas).filter(i=>i.scope===scope).sort((a,b)=>b.prio-a.prio).slice(0, scope==='board'?2:3);
  if(!items.length) return '';
  const icon=l=> l==='warn'?'⚠️': l==='good'?'✅':'💡';
  const rows=items.map(i=>'<div class="insight '+i.level+'"><span class="ic">'+icon(i.level)+'</span><span class="it">'+i.text+'</span></div>').join('');
  return '<div class="card ins"><div class="ct">Observaciones</div>'+rows+'</div>';
}

function noCapList(m){ if(!m) return '<div class="empty" style="padding:14px">Sin gastos todavía.</div>'; const ks=Object.keys(m).filter(k=>m[k]>0); if(!ks.length) return '<div class="empty" style="padding:14px">Sin gastos en estas categorías todavía.</div>'; return ks.map(k=>'<div class="xrow"><span class="dot" style="background:'+cc(k)+'"></span><span class="d">'+k+'</span><span class="a">'+fmt(m[k])+'</span></div>').join(''); }
function tarjetasCard(s){
  const pago=s.tarjeta||0;
  const cm=(s.tarjetaMes!==undefined? s.tarjetaMes : cardSpent(s));
  const tope=+((s.topes&&s.topes.tarjeta)||0);
  const el=s.elapsed||1, dim=s.dim||30; const proj=(s.isCur&&el)?Math.round(cm/el*dim):cm;
  const paid=!!s.tarjetaPaid;
  const pagoHTML = pago>0
    ? '<div class="frow'+(paid?' paid':'')+'" style="border-bottom:none;padding:6px 0"><button class="paychk'+(paid?' on':'')+'" data-paycard="'+pago+'">'+(paid?'✓':'')+'</button><span class="fd" style="flex:1">A pagar este mes<small>total de tu resumen'+(paid?' · ✓ pagada':'')+'</small></span><span class="fa">'+fmt(pago)+'</span></div>'
    : '<div class="hint" style="margin-top:0">Cargá el total de tu resumen en la pestaña Mes: es lo que pagás e impacta directo en tu ahorro.</div>';

function fijosCards(s){

// Mis fijos: personales + mi parte de los del hogar (Ambos → *miShare; quien===yo → full)
function fijosDetalleYo(){
  const s=summary; if(!s) return [];
  const out=(s.misPersonales||[]).map(f=>({nombre:f.nombre,monto:f.monto,paid:f.paid}));
  (s.fijosHogar||[]).forEach(f=>{ let m;
    if(f.quien==='Ambos') m=Math.round(f.monto*(s.miShare||0));
    else if(f.quien===s.yo) m=f.monto; else m=0;
    if(m>0) out.push({nombre:f.nombre+(f.quien==='Ambos'?' (tu parte)':''),monto:m,paid:f.paid});
  });
  return out;
}

// Barra de composición: cómo se reparte el ingreso (fijos / tarjeta / variable no-tarjeta / ahorro)
function compBar(ingreso,fijos,tarjeta,ahorro){
  const ah=Math.max(ahorro,0);
  const varNC=Math.max(0, ingreso-fijos-tarjeta-ah); // gasto por fuera de tarjeta que se comió el ingreso
  const varReal=ingreso-fijos-tarjeta-ahorro;        // variable real (usa el ahorro real, puede reflejar sobregasto)
  const total=Math.max(1, fijos+tarjeta+varNC+ah);
  const w=v=>(v/total*100).toFixed(1)+'%';
  const seg=(v,cls,lab)=> v>0?'<div class="cseg '+cls+'" style="width:'+w(v)+'" title="'+lab+' '+fmt(v)+'"></div>':'';
  const pc=v=>ingreso>0?pctf(v/ingreso):'0%';
  const li=(cls,lab,val)=>'<span><i class="sw '+cls+'"></i>'+lab+' <b>'+kf(val)+'</b> ('+pc(val)+')</span>';
  return '<div class="compbar">'+seg(fijos,'c-fij','Fijos')+seg(tarjeta,'c-tar','Tarjeta')+seg(varNC,'c-var','Variable')+seg(ah,'c-aho','Ahorro')+'</div>'
    +'<div class="legend compleg" style="flex-wrap:wrap;gap:8px 16px">'
    + li('c-fij','Fijos',fijos) + li('c-tar','Tarjeta',tarjeta) + li('c-var','Variable',varReal) + li('c-aho','Ahorro',ahorro)
    +'</div>';
}

  +'<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">'

  +'<button class="btn ghost" id="bPin" style="flex:1;min-width:120px">'+(getPin()?'Cambiar PIN':'Activar PIN')+'</button>'
  +(getPin()?'<button class="btn ghost" id="bPinOff" style="flex:1;min-width:120px">Quitar PIN</button>':'')
  +'</div>'
  +'<div class="hint" style="margin-top:8px">El PIN bloquea este teléfono al abrir la app. Es protección local (privacidad blanda): no cifra los datos del Sheet.</div></div>'
  +'<div class="card"><div class="eyebrow">Lo tuyo · '+labelYM(curYM)+'</div>'
  +'<div class="hint">Estos son <b>tus</b> datos (solo vos los ves). Al empezar el mes revisá tu sueldo y el total de tu tarjeta a pagar; con eso alcanza. El resto ya está listo.</div>'
  +'<div class="blk">Tu ingreso y tu tarjeta</div>'
  +row('income'+slot,'Tu sueldo')+row('tarjetas_'+slot,'Tu tarjeta a pagar','total de tu resumen')
  +row('tope_tarjeta_'+slot,'Tu tope de tarjeta','0 = sin tope')
  +'<div class="blk">Tus avisos por mail</div>'
  +sel('rep_pagos_'+slot,'Aviso de pagos',[['off','No enviar'],['dia','El día del vencimiento'],['previo','El día anterior']])
  +sel('rep_resumen_'+slot,'Resumen completo',[['off','No enviar'],['semanal','Semanal (lunes)'],['mensual','Mensual (día 1)']])
  +'</div>'
  +'<div class="card"><div class="eyebrow">Del hogar (compartido)</div>'
  +'<div class="hint">Los topes compartidos. <b>Ya vienen configurados</b>: tocá solo si algo cambió. Lo editan cualquiera de los dos.</div>'
  +'<div class="blk">Topes variables (dinámicos)</div>'
  +row('pct_comer','Comer afuera (% del ingreso de cada uno)','sugerido 8–10%',true)+row('pct_salidas','Salidas (% del ingreso de cada uno)','sugerido 5%',true)
  +'<div class="cfgrow"><span class="k">Súper del hogar<small>'+(s&&s.superSug?('sugerido '+fmt(s.superSug)+' · prom. 3 meses'):'sin historial aún')+'</small></span><input class="ci" onfocus="this.select()" oninput="this.value=fmtNum(this.value)" data-key="cap_super" inputmode="decimal" value="'+fmtNum(v('cap_super'))+'"></div>'
  +(s&&s.superSug?'<div class="suggest" id="useSug">↳ usar sugerencia '+fmt(s.superSug)+'</div>':'')
  +'</div>'
  +'<div class="card" style="margin-bottom:80px"><div class="eyebrow">Gastos fijos</div>'
  +'<div class="hint"><b>Avanzado.</b> La lista ya está cargada. Entrá solo si querés ajustar un monto o agregar/sacar un fijo. Cada uno: nombre, monto, quién paga, tipo (Hogar/Personal) y día de vencimiento.</div>'
  +'<div style="margin-top:10px">'+(allF.length?allF.map(fijoEdit).join(''):'<div class="empty">Sin fijos. Agregá el primero.</div>')+'</div>'
  +'<button class="btn ghost" id="bAddFijo">+ Agregar gasto fijo</button></div>'
  +'<div class="savebar"><button class="btn" id="bCfg">Guardar el mes</button></div>';
}

function wire(){
  try{updCalc();}catch(e){}
  try{updCuota();}catch(e){}
  document.querySelectorAll('[data-dwho]').forEach(b=>b.onclick=()=>{dashWho=b.dataset.dwho;render();});
  document.querySelectorAll('[data-addmode]').forEach(b=>b.onclick=()=>{addMode=b.dataset.addmode;render();});
  function syncAddInputs(){ const a=document.getElementById('iAmt'); if(a)draft.monto=a.value; const md=document.getElementById('iMedio'); if(md)draft.medio=md.value; const f=document.getElementById('iFecha'); if(f)draft.fecha=f.value; const nt=document.getElementById('iNota'); if(nt)draft.nota=nt.value; }
  document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{ syncAddInputs(); draft.cat=b.dataset.c; draft.vis=HOGAR_CATS.includes(draft.cat)?'compartido':'privado'; render(); });
  document.querySelectorAll('[data-vis]').forEach(b=>b.onclick=()=>{ syncAddInputs(); draft.vis=b.dataset.vis; render(); });
  document.querySelectorAll('[data-cvis]').forEach(b=>b.onclick=()=>{ syncCuotaInputs(); cdraft.vis=b.dataset.cvis; render(); });
  document.querySelectorAll('[data-cmodo]').forEach(b=>b.onclick=()=>{ syncCuotaInputs(); cdraft.modo=b.dataset.cmodo; render(); });
  const amt=document.getElementById('iAmt'); if(amt)amt.oninput=e=>draft.monto=e.target.value;
  const bAdd=document.getElementById('bAdd'); if(bAdd)bAdd.onclick=()=>{
    if(Date.now()-lastSave<900) return;        // anti doble-toque (evita duplicados)
    const m=evalMonto(document.getElementById('iAmt').value);
    if(!m||m<=0){document.getElementById('iAmt').focus();return;}
    lastSave=Date.now();
    draft.medio=document.getElementById('iMedio').value;draft.fecha=document.getElementById('iFecha').value;draft.nota=document.getElementById('iNota').value.trim();
    post({action:'save',monto:m,cat:draft.cat,quien:yo,medio:draft.medio,fecha:draft.fecha,nota:draft.nota,visibilidad:draft.vis});
    if(summary&&summary.expenses&&draft.fecha.slice(0,7)===curYM){
      summary.expenses.push({id:'t'+Date.now(),date:draft.fecha,quien:yo,cat:draft.cat,medio:draft.medio,monto:m,nota:draft.nota,vis:draft.vis});
      recompute();
    }
    toast('✓ '+fmt(m)+' · '+draft.cat);
    draft.monto='';draft.nota='';   // se queda en Cargar; NO hace focus (no abre teclado) NI relee (no borra)
    render();
  };
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(!confirm('¿Eliminar gasto?'))return;post({action:'delete',id:b.dataset.del});if(summary&&summary.expenses){summary.expenses=summary.expenses.filter(e=>String(e.id)!==String(b.dataset.del));recompute();}render();});
  document.querySelectorAll('[data-delc]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Eliminar esta cuota?'))return;await post({action:'deleteCuota',id:b.dataset.delc});cuotas=await api({action:'cuotas',ym:curYM});render();});
  const bC=document.getElementById('bCuota'); if(bC)bC.onclick=async()=>{
    syncCuotaInputs();
    const desc=(cdraft.descripcion||'').trim();
    const n=parseInt(cdraft.n_cuotas)||0;
    let cuota;
    if(cdraft.modo==='cuota'){ cuota=parseNum(cdraft.cuota_mensual); }
    else { const tot=parseNum(cdraft.total); cuota = n? Math.round(tot/n*100)/100 : 0; }
    if(!cuota||!n){ alert('Completá '+(cdraft.modo==='cuota'?'la cuota':'el total')+' y la cantidad de cuotas'); return; }
    bC.textContent='Guardando…';
    await post({action:'addCuota',descripcion:desc,quien:yo,cuota_mensual:cuota,n_cuotas:n,mes_inicio:cdraft.mes_inicio,visibilidad:cdraft.vis});
    cdraft={descripcion:'',quien:yo,cuota_mensual:'',n_cuotas:'',mes_inicio:curYM,vis:'privado',modo:cdraft.modo,total:''};
    cuotas=await api({action:'cuotas',ym:curYM});dash=null;render();
    toast('✓ Cuota agregada: '+fmtd(cuota)+' × '+n);
  };
  const us=document.getElementById('useSug'); if(us)us.onclick=()=>{document.querySelector('[data-key="cap_super"]').value=fmtNum(summary.superSug);};
  // reclasificar visibilidad de un movimiento (privado <-> compartido)
  document.querySelectorAll('[data-vistoggle]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.vistoggle, nv=(b.dataset.vis==='compartido')?'privado':'compartido';
    post({action:'setVis', id:id, visibilidad:nv});
    if(summary&&summary.expenses){ const e=summary.expenses.find(x=>String(x.id)===String(id)); if(e){ e.vis=nv; recompute(); } }
    dash=null; toast(nv==='compartido'?'👥 Ahora es compartido':'🔒 Ahora es privado'); render();
  });
  // marcar/desmarcar el pago de la tarjeta del mes
  document.querySelectorAll('[data-paycard]').forEach(b=>b.onclick=()=>{
    const paid=summary&&summary.tarjetaPaid;
    post({action: paid?'quitarPago':'marcarPago', fijoId:'card:'+yo, mes:curYM, nombre:'Tarjeta ('+yo+')', monto:+b.dataset.paycard||0, quien:yo, tipo:'Tarjeta'});
    if(summary) summary.tarjetaPaid=!paid;
    render();
  });
  // toggle de pagado (Tablero)
  document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.pay, wasPaid=b.dataset.paid==='1';
    post({action: wasPaid?'quitarPago':'marcarPago', fijoId:id, mes:curYM});
    if(summary){ const upd=f=>{if(String(f.id)===String(id))f.paid=!wasPaid;};
      (summary.fijosHogar||[]).forEach(upd);(summary.misPersonales||[]).forEach(upd); }
    dash=null; render();
  });
  // agregar fijo
  const bAF=document.getElementById('bAddFijo'); if(bAF)bAF.onclick=async()=>{
    bAF.textContent='Agregando…'; bAF.disabled=true;
    try{
      const res=await api({action:'addFijo',nombre:'Nuevo gasto',monto:0,quien:yo,tipo:'Personal',dia:1});
      if(res&&res.ok&&res.fijo&&summary){ summary.misPersonales=(summary.misPersonales||[]).concat([res.fijo]); }
      else { const sm=await api({action:'summary',ym:curYM}); if(sm&&!sm.error) summary=sm; }
    }catch(e){ toast('No se pudo agregar. Probá de nuevo.'); }
    finally{ render(); }   // SIEMPRE re-renderiza: el botón nunca queda en "Agregando…"
  };
  // borrar fijo (optimista: desaparece al instante)
  document.querySelectorAll('[data-delf]').forEach(b=>b.onclick=()=>{ if(!confirm('¿Eliminar este gasto fijo?'))return;
    post({action:'deleteFijo',id:b.dataset.delf});
    if(summary){ const keep=f=>String(f.id)!==String(b.dataset.delf); summary.misPersonales=(summary.misPersonales||[]).filter(keep); summary.fijosHogar=(summary.fijosHogar||[]).filter(keep); }
    render();
  });
  const bCfg=document.getElementById('bCfg'); if(bCfg)bCfg.onclick=async()=>{
    const up={};
    document.querySelectorAll('.ci').forEach(i=>{if(i.value!=='')up[i.dataset.key]=parseNum(i.value);});
    document.querySelectorAll('.cs').forEach(i=>{up[i.dataset.key]=i.value;});
    // guardar cambios de cada fijo
    document.querySelectorAll('.fijoedit').forEach(fe=>{
      post({action:'updateFijo', id:fe.dataset.fid,
        nombre:fe.querySelector('.fe-nombre').value,
        monto:parseNum(fe.querySelector('.fe-monto').value),
        dia:parseInt(fe.querySelector('.fe-dia').value)||0,
        quien:fe.querySelector('.fe-quien').value,
        tipo:fe.querySelector('.fe-tipo').value });
    });
    bCfg.textContent='Guardando…';post({action:'saveConfig',updates:up,ym:curYM});toast('✓ Mes guardado');dash=null;reconciliar(1800);
  };
  // ---- Cuenta: cambiar usuario / PIN ----
  const bSwitch=document.getElementById('bSwitch'); if(bSwitch)bSwitch.onclick=()=>{ if(!confirm('¿Cambiar de usuario en este teléfono?'))return; localStorage.removeItem('fh_yo'); yo=''; boot(); };
  const bPin=document.getElementById('bPin'); if(bPin)bPin.onclick=()=>{
    if(getPin()){ if(confirm('El PIN ya está activo. ¿Querés cambiarlo?')) askNewPin(); }
    else askNewPin();
  };
  const bPinOff=document.getElementById('bPinOff'); if(bPinOff)bPinOff.onclick=()=>{ if(confirm('¿Quitar el PIN de acceso?')){ setPin(''); toast('PIN quitado'); render(); } };
}
function askNewPin(){
  const p=prompt('Elegí un PIN de 4 a 6 dígitos:'); if(p===null) return;
  if(!/^\d{4,6}$/.test(p)){ alert('El PIN tiene que ser de 4 a 6 dígitos.'); return; }
  const p2=prompt('Repetí el PIN:'); if(p2===null) return;
  if(p!==p2){ alert('No coinciden.'); return; }
  setPin(p); unlocked=true; toast('✓ PIN activado'); render();
}

// ===== Identidad + PIN (privacidad blanda: viven en este dispositivo) =====
function hashPin(s){ let h=5381; for(let i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))>>>0;} return 'p'+h.toString(36); }
function getPin(){ return localStorage.getItem('fh_pin')||''; }
function setPin(p){ if(p) localStorage.setItem('fh_pin',hashPin(String(p))); else localStorage.removeItem('fh_pin'); }
function gateEl(){ let g=document.getElementById('gate'); if(!g){ g=document.createElement('div'); g.id='gate'; document.body.appendChild(g); } return g; }
function hideGate(){ const g=document.getElementById('gate'); if(g) g.remove(); }
function showIdentityGate(){
  const g=gateEl();
  g.innerHTML='<div class="gatebox"><div class="gtitle">Finanzas <b>hogar</b></div><div class="gsub">¿Quién sos?</div>'
    +'<button class="gbtn" data-id="Lautaro">Lautaro</button>'
    +'<button class="gbtn" data-id="Vanessa">Vanessa</button>'
    +'<div class="ghint">Queda guardado en este teléfono. Lo podés cambiar después desde Configuración.</div></div>';
  g.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{ yo=b.dataset.id; localStorage.setItem('fh_yo',yo); draft.quien=yo; cdraft.quien=yo; boot(); });
}
function showPinGate(){
  const g=gateEl();
  g.innerHTML='<div class="gatebox"><div class="gtitle">Finanzas <b>hogar</b></div><div class="gsub">Hola '+yo+', ingresá tu PIN</div>'
    +'<input id="pinIn" class="ginput" type="password" inputmode="numeric" maxlength="6" placeholder="••••">'
    +'<button class="gbtn" id="pinOk">Entrar</button><div id="pinErr" class="gerr"></div>'
    +'<div class="ghint" id="pinSwitch">Cambiar de usuario</div></div>';
  const inp=g.querySelector('#pinIn'); setTimeout(()=>{try{inp.focus();}catch(e){}},120);
  const tryPin=()=>{ if(hashPin(inp.value)===getPin()){ unlocked=true; hideGate(); startApp(); } else { g.querySelector('#pinErr').textContent='PIN incorrecto'; inp.value=''; try{inp.focus();}catch(e){} } };
  g.querySelector('#pinOk').onclick=tryPin;
  inp.onkeydown=e=>{ if(e.key==='Enter') tryPin(); };
  g.querySelector('#pinSwitch').onclick=()=>{ localStorage.removeItem('fh_yo'); yo=''; boot(); };
}
function boot(){
  yo=localStorage.getItem('fh_yo')||'';
  if(!yo){ showIdentityGate(); return; }
  draft.quien=yo; cdraft.quien=yo;
  if(getPin() && !unlocked){ showPinGate(); return; }
  startApp();
}
function startApp(){ hideGate(); loadAll(); }
boot();
</script>
