<!doctype html>
<html lang="es">
<head>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanzas hogar">
<title>Finanzas hogar</title>
<style>
:root{
  --ink:#15201f;--ink2:#2c3a38;--paper:#f3efe6;--card:#fbfaf6;
  --line:#ddd6c7;--muted:#7c857f;
  --pine:#1f5d4c;--pine-s:#e2efe7;--gold:#c98a2b;--gold-s:#f6e9d2;
  --clay:#c0512f;--clay-s:#f7ddd2;--blue:#3f6791;
  --sh:0 1px 0 rgba(0,0,0,.04),0 8px 24px -16px rgba(21,32,31,.28);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);overscroll-behavior:none;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:540px;margin:0 auto;padding:0 14px 96px}
header{max-width:540px;margin:0 auto;padding:16px 14px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-size:20px;font-weight:800;letter-spacing:-.5px}.brand b{color:var(--pine)}
.mrow{display:flex;align-items:center;gap:4px;background:var(--pine);border-radius:12px;padding:3px}
.mrow span{font-size:15px;font-weight:800;color:#fff;min-width:120px;text-align:center;letter-spacing:-.2px;text-transform:capitalize}
.mrow button{border:none;background:rgba(255,255,255,.15);color:#fff;font-size:18px;line-height:1;cursor:pointer;padding:7px 12px;border-radius:9px}
.mrow button:active{background:rgba(255,255,255,.35)}
.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--ink);display:flex;align-items:center;
  z-index:30;padding:0 4px env(safe-area-inset-bottom,4px);height:66px}
.tabs button{flex:1;border:none;background:none;color:#8aa0a0;padding:6px 0;font-size:10.5px;font-weight:700;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tabs button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button span{font-size:10.5px}
.tabs button.on{color:#fff}
.tabs button.fab svg{width:24px;height:24px;background:var(--gold);color:#fff;border-radius:50%;padding:11px;
  box-sizing:content-box;stroke-width:2.6;box-shadow:0 4px 12px -2px rgba(201,138,43,.6)}
.tabs button.fab span{color:var(--gold)}
.tabs button.fab.on svg{background:var(--clay);box-shadow:0 4px 12px -2px rgba(192,81,47,.6)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0;box-shadow:var(--sh)}
.ct{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:12px}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{border-radius:14px;padding:12px 14px;border:1px solid var(--line);background:#fff}
.pill .who{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.pill .big{font-size:21px;font-weight:800;letter-spacing:-.5px;margin:3px 0 2px}
.pill .sub{font-size:12px;font-weight:700}
.pos{color:var(--pine)}.neg{color:var(--clay)}.amber{color:var(--gold)}
.meter{margin:12px 0}
.meter .mh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.meter .ml{font-size:13px;font-weight:700}.meter .mv{font-size:12px;font-weight:600;color:var(--muted)}
.track{height:10px;background:#eee7da;border-radius:99px;overflow:hidden}
.fill{height:100%;border-radius:99px;transition:width .4s ease}
.m-ok .fill{background:var(--pine)}.m-warn .fill{background:var(--gold)}.m-over .fill{background:var(--clay)}
.mf{font-size:11.5px;font-weight:600;margin-top:4px}
.m-ok .mf{color:var(--pine)}.m-warn .mf{color:var(--gold)}.m-over .mf{color:var(--clay)}
.tag{font-size:11px;color:var(--muted);font-weight:600}
.banner{border-radius:12px;padding:11px 14px;font-size:13px;font-weight:600;margin:8px 0;line-height:1.45}
.b-red{background:var(--clay-s);color:#7a2a14}.b-amber{background:var(--gold-s);color:#7a4d12}.b-green{background:var(--pine-s);color:#174d3a}
.fg{margin-bottom:14px}
label.lbl{display:block;font-size:12px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
input,select{width:100%;max-width:100%;min-width:0;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:16px;color:var(--ink);font-family:inherit;-webkit-appearance:none;appearance:none}
input[type=date],input[type=month]{min-height:46px;line-height:1.1}
.grid2>div{min-width:0}
input:focus,select:focus{outline:none;border-color:var(--pine);box-shadow:0 0 0 3px var(--pine-s)}
.amt-wrap{position:relative}
.amt-wrap::before{content:'$';position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:20px;font-weight:700;color:var(--muted)}
.amt-wrap input{padding-left:30px;font-size:26px;font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.catgrid button{padding:13px 10px;border:1.5px solid var(--line);background:#fff;border-radius:12px;font-size:14px;
  font-weight:700;color:var(--ink2);cursor:pointer;text-align:left}
.catgrid button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:12px;border:1.5px solid var(--line);background:#fff;border-radius:12px;font-size:14px;font-weight:700;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn{display:block;width:100%;padding:15px;border:none;border-radius:13px;background:var(--pine);color:#fff;font-size:16px;font-weight:800;cursor:pointer;margin-top:4px}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:600;font-size:14px;padding:11px}
.xrow{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.xrow:last-child{border-bottom:none}
.dot{width:9px;height:9px;border-radius:99px;flex:none}
.xrow .d{flex:1;font-size:13.5px;font-weight:600;overflow:hidden}
.xrow .d small{display:block;color:var(--muted);font-size:11.5px;font-weight:500}
.xrow .a{font-weight:800;font-size:14px;white-space:nowrap}
.xrow .x{border:none;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:2px 6px}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:13.5px;line-height:1.6}
.cfgrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
.cfgrow:last-child{border-bottom:none}
.cfgrow .k{flex:1;font-size:13px;font-weight:600;color:var(--ink2)}
.cfgrow .k small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.cfgrow input{width:115px;text-align:right;padding:7px 10px;font-size:14px;font-weight:700}
.blk{font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--pine);margin:16px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.blk:first-child{margin-top:0}
.hint{font-size:12px;color:var(--muted);line-height:1.5;margin-top:8px}
.suggest{font-size:11.5px;color:var(--pine);font-weight:700;cursor:pointer}
.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--pine-s);border-top-color:var(--pine);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.bars{display:flex;align-items:flex-end;gap:7px;height:130px;padding-top:8px}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.bars .bar{width:100%;border-radius:6px 6px 0 0;background:var(--pine);min-height:3px;transition:height .4s}
.bars .lab{font-size:10px;color:var(--muted);font-weight:600}
.bars .val{font-size:9.5px;color:var(--ink2);font-weight:700}
.gbars{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:14px}
.gbars .gcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.gbars .pair{display:flex;align-items:flex-end;gap:3px;height:100%;width:100%;justify-content:center}
.gbars .b{width:44%;max-width:15px;border-radius:5px 5px 0 0;min-height:2px;transition:height .4s}
.gbars .b.g{background:var(--clay)}
.gbars .b.a{background:var(--pine)}
.gbars .lab{font-size:10px;color:var(--muted);font-weight:600}
.legend{display:flex;gap:16px;font-size:11.5px;font-weight:600;color:var(--muted);margin:10px 0 2px}
.legend span{display:flex;align-items:center;gap:6px}
.legend .sw{width:11px;height:11px;border-radius:3px;display:inline-block}
.legend .sw.g{background:var(--clay)}.legend .sw.a{background:var(--pine)}
.pill .proj{font-size:11px;font-weight:600;color:var(--muted);margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);line-height:1.3}
.pill .proj b{font-weight:800}
.catbar{margin:9px 0}
.catbar .top{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:4px}
.catbar .tr{height:8px;background:#eee7da;border-radius:99px;overflow:hidden}
.catbar .fl{height:100%;border-radius:99px}
.frow{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:none}
.frow .chk{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);background:#fff;color:#fff;font-size:15px;font-weight:800;flex:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.frow.paid .chk{background:var(--pine);border-color:var(--pine)}
.frow .fd{flex:1;font-size:13.5px;font-weight:600}
.frow .fd small{display:block;color:var(--muted);font-size:11.5px;font-weight:500}
.frow.paid .fd{color:var(--muted);text-decoration:line-through}
.frow .fa{font-weight:800;font-size:14px}
.ftot{font-size:12px;color:var(--muted);font-weight:700;margin-top:10px;text-align:right}
.fijoedit{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:#fff}
.fijoedit input,.fijoedit select{padding:9px 10px;font-size:14px}
.fijoedit .fe-nombre{width:100%;margin-bottom:6px;font-weight:700}
.fe-line{display:flex;gap:6px;align-items:center;margin-top:6px}
.fe-line .fe-monto{flex:1.4;min-width:0}
.fe-line .fe-dia{width:64px;flex:none;text-align:center}
.fe-line select{flex:1;min-width:0}
.fe-del{border:none;background:none;color:var(--clay);font-size:22px;cursor:pointer;padding:0 6px;flex:none}
.savebar{position:fixed;left:0;right:0;bottom:66px;max-width:540px;margin:0 auto;padding:10px 14px 12px;
  background:linear-gradient(to top, var(--paper) 55%, transparent);z-index:25}
.savebar .btn{margin:0;box-shadow:0 6px 18px -6px rgba(31,93,76,.5)}
#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:99px;font-size:13.5px;font-weight:700;opacity:0;pointer-events:none;transition:all .25s;z-index:50;box-shadow:0 8px 24px -8px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header>
  <div class="brand">Finanzas <b>hogar</b></div>
  <div class="mrow"><button id="prevM">&#8249;</button><span id="mLabel">—</span><button id="nextM">&#8250;</button></div>
</header>
<div class="wrap" id="app"><div class="card" style="text-align:center;padding:40px"><div class="spin"></div></div></div>
<nav class="tabs">
  <button data-tab="board" class="on">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="9" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="10" width="8" height="11" rx="2"/><rect x="3" y="14" width="8" height="7" rx="2"/></svg>
    <span>Tablero</span>
  </button>
  <button data-tab="cuotas">
    <svg viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/></svg>
    <span>Cuotas</span>
  </button>
  <button data-tab="add" class="fab">
    <svg viewBox="0 0 24 24"><line x1="12" y1="6" x2="12" y2="18"/><line x1="6" y1="12" x2="18" y2="12"/></svg>
    <span>Cargar</span>
  </button>
  <button data-tab="dash">
    <svg viewBox="0 0 24 24"><line x1="4" y1="20" x2="4" y2="13"/><line x1="10" y1="20" x2="10" y2="8"/><line x1="16" y1="20" x2="16" y2="11"/><line x1="21" y1="20" x2="3" y2="20"/></svg>
    <span>Evolución</span>
  </button>
  <button data-tab="cfg">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19 13.5a1.5 1.5 0 0 0 .3 1.65l.05.05a1.8 1.8 0 1 1-2.55 2.55l-.05-.05a1.5 1.5 0 0 0-2.55 1.07V19a1.8 1.8 0 1 1-3.6 0v-.1a1.5 1.5 0 0 0-2.55-1.06l-.05.05a1.8 1.8 0 1 1-2.55-2.55l.05-.05A1.5 1.5 0 0 0 5 13.5a1.5 1.5 0 0 0-1.37-.9H3.5a1.8 1.8 0 1 1 0-3.6h.1A1.5 1.5 0 0 0 5 8.05l.05-.05A1.5 1.5 0 0 0 5 5.4l-.05-.05A1.8 1.8 0 1 1 7.5 2.8l.05.05A1.5 1.5 0 0 0 9.2 3.2 1.5 1.5 0 0 0 10.1 1.8V1.7a1.8 1.8 0 1 1 3.6 0v.1a1.5 1.5 0 0 0 .9 1.37 1.5 1.5 0 0 0 1.65-.3l.05-.05a1.8 1.8 0 1 1 2.55 2.55l-.05.05a1.5 1.5 0 0 0-.3 1.65 1.5 1.5 0 0 0 1.37.9h.1a1.8 1.8 0 1 1 0 3.6h-.1a1.5 1.5 0 0 0-1.37.9z"/></svg>
    <span>Mes</span>
  </button>
</nav>
<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycby-G1_5nb98oPPjkVMU8nAjkDynTs4W0azUJ3I_zhQIRwHuaqK5gLyViJNAGIkz8PZbiA/exec'; // ← pegá acá la URL del deployment

const MONTHS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function hoyISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
let curYM=hoyISO().slice(0,7);
let tab='board', summary=null, dash=null, cuotas=null, loading=false, netError=false, editStamp=0;
let draft={monto:'',cat:'Comer afuera',quien:'Lautaro',medio:'Tarjeta',fecha:hoyISO(),nota:''};
let cdraft={descripcion:'',quien:'Lautaro',cuota_mensual:'',n_cuotas:'',mes_inicio:curYM};
let dashWho='Ambos'; // selector de Evolución: 'L' | 'V' | 'Ambos'

const fmt=n=>'$'+Math.round(n||0).toLocaleString('es-AR');
function fmtNum(v){const s=String(v).replace(/[^\d]/g,'');return s?parseInt(s,10).toLocaleString('es-AR'):'';}
function parseNum(v){return parseFloat(String(v).replace(/\./g,'').replace(',','.'))||0;}
const pctf=p=>(p*100).toFixed(0)+'%';
const labelYM=ym=>{const[y,m]=ym.split('-');return MONTHS[+m-1]+' '+y;};
const CC={'Comer afuera':'var(--clay)','Delivery':'var(--gold)','Súper':'var(--pine)','Salidas':'#b5683a','Combustible':'var(--blue)','Agua':'#4a9ec7','Viajes':'#4a7c7c','Gastos personales':'#8b7fae','Ropa':'#b06a8f','Otros':'var(--muted)','Fijos hogar':'#5b6b66','Fijos personales':'#8b7fae'};

function cc(c){return CC[c]||'var(--muted)';}
async function api(p,timeoutMs){p._=Date.now();const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),timeoutMs||15000);try{const r=await fetch(SCRIPT_URL+'?'+new URLSearchParams(p),{cache:'no-store',signal:ctrl.signal});return await r.json();}finally{clearTimeout(t);}}
function post(b){
  editStamp=Date.now();  // hubo escritura local: un refresh viejo no debe pisarla
  // fire-and-forget en no-cors: la escritura viaja igual y NUNCA cuelga la UI
  try{ fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(b)}); }catch(e){}
}
// ---- caché local: abre al instante con la última foto y refresca por detrás ----
function cacheKey(ym){return 'fh_v1_'+ym;}
function saveCache(){ if(!summary||summary.error||loading) return; try{ localStorage.setItem(cacheKey(curYM), JSON.stringify({summary,dash,cuotas})); }catch(e){} }
function loadCache(ym){ try{ const s=localStorage.getItem(cacheKey(ym)); return s?JSON.parse(s):null; }catch(e){ return null; } }
async function fetchBundle(){
  const d=await api({action:'all',ym:curYM});
  if(d&&d.error==='action?'){ const sm=await api({action:'summary',ym:curYM}); return {summary:sm,dash:null,cuotas:null}; } // backend viejo
  if(!d||d.error) throw new Error((d&&d.error)||'respuesta vacía');
  return {summary:d.summary,dash:d.dashboard,cuotas:d.cuotas};
}
let _rc=null, lastSave=0;
function reconciliar(delay){ clearTimeout(_rc); _rc=setTimeout(async()=>{ try{ summary=await api({action:'summary',ym:curYM}); dash=null; render(); }catch(e){} }, delay||2500); }
function toast(msg){
  let t=document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t); }
  t.textContent=msg; t.className='show';
  clearTimeout(t._h); t._h=setTimeout(()=>t.className='',1600);
}
// recalcula gastos/ahorro en el cliente (para que el optimismo sea consistente)
function recompute(){
  const s=summary; if(!s||!s.expenses) return;
  const el=s.elapsed||1, dim=s.dim||30;
  const S=(who,cats)=>s.expenses.filter(e=>(!who||e.quien===who)&&cats.includes(e.cat)).reduce((a,e)=>a+(+e.monto||0),0);
  const NOCAP=['Combustible','Agua','Viajes','Gastos personales','Ropa','Otros'];
  const noCap={}; NOCAP.forEach(c=>noCap[c]=S(null,[c]));
  const g={comerL:S('Lautaro',['Comer afuera','Delivery']),comerV:S('Vanessa',['Comer afuera','Delivery']),
    salidasL:S('Lautaro',['Salidas']),salidasV:S('Vanessa',['Salidas']),superT:S(null,['Súper']),noCap};
  s.gastos=g;
  const proj=v=>el?Math.round(v/el*dim):v;
  const NC=(who,cats)=>s.expenses.filter(e=>(!who||e.quien===who)&&cats.includes(e.cat)&&e.medio!=='Tarjeta').reduce((a,e)=>a+(+e.monto||0),0);
  const vc=['Comer afuera','Delivery','Salidas','Combustible','Agua','Viajes','Gastos personales','Ropa','Otros'];
  const tL=(s.tarjetas&&s.tarjetas.L)||0, tV=(s.tarjetas&&s.tarjetas.V)||0;
  s.savings={L:s.income.L-s.fijos.L-tL-NC('Lautaro',vc)-NC(null,['Súper'])*s.sL,
           V:s.income.V-s.fijos.V-tV-NC('Vanessa',vc)-NC(null,['Súper'])*s.sV};
  s.savingsProj={L:s.income.L-s.fijos.L-tL-proj(NC('Lautaro',vc))-proj(NC(null,['Súper']))*s.sL,
           V:s.income.V-s.fijos.V-tV-proj(NC('Vanessa',vc))-proj(NC(null,['Súper']))*s.sV};
  s.pct={L:s.income.L?s.savings.L/s.income.L:0, V:s.income.V?s.savings.V/s.income.V:0};
}

async function loadAll(){
  const reqStamp=Date.now();
  const c=loadCache(curYM);
  if(c&&c.summary){ summary=c.summary; dash=c.dash||null; cuotas=c.cuotas||null; loading=false; netError=false; render(); }
  else { summary=null; dash=null; cuotas=null; loading=true; netError=false; render(); }
  try{
    const b=await fetchBundle();
    if(editStamp>reqStamp){ loading=false; render(); return; } // hubo edición local mientras cargaba
    summary=b.summary; dash=b.dash; cuotas=b.cuotas;
    loading=false; netError=false; render();
  }catch(e){
    loading=false;
    if(!summary){ netError=true; }   // solo error duro si no hay nada cacheado que mostrar
    render();
  }
}

// month nav — atado UNA sola vez (este era el bug de los saltos)
document.getElementById('prevM').onclick=()=>shiftMonth(-1);
document.getElementById('nextM').onclick=()=>shiftMonth(1);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=async()=>{
  tab=b.dataset.tab;
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  render(); // muestra el contenido o un spinner al instante
  // carga diferida de las secciones pesadas
  if(tab==='dash'&&!dash){ dash=await api({action:'dashboard',ym:curYM}); if(tab==='dash')render(); }
  if(tab==='cuotas'&&!cuotas){ const c=await api({action:'cuotas',ym:curYM}); cuotas=c; if(tab==='cuotas')render(); }
});
function shiftMonth(d){
  const[y,m]=curYM.split('-').map(Number);
  const nd=new Date(y,m-1+d,1);
  curYM=nd.getFullYear()+'-'+String(nd.getMonth()+1).padStart(2,'0');
  dash=null;cuotas=null;loadAll();
}

function render(){
  document.getElementById('mLabel').textContent=labelYM(curYM);
  const app=document.getElementById('app');
  if(loading){app.innerHTML='<div class="card" style="text-align:center;padding:40px"><div class="spin"></div></div>';return;}
  if(netError&&!summary){app.innerHTML='<div class="card" style="text-align:center;padding:36px 20px"><div style="font-size:15px;font-weight:700;margin-bottom:6px">No pude conectar</div><div class="hint" style="margin:0 0 16px">El servidor puede estar iniciándose. Probá de nuevo en unos segundos.</div><button class="btn" onclick="loadAll()">Reintentar</button></div>';return;}
  if(summary&&summary.error){app.innerHTML='<div class="card"><div class="banner b-red">No me pude conectar al Sheet. Revisá que el deployment esté activo y la URL sea correcta.<br><small>'+summary.error+'</small></div><button class="btn" style="margin-top:12px" onclick="loadAll()">Reintentar</button></div>';return;}
  if(tab==='board')app.innerHTML=viewBoard();
  else if(tab==='add')app.innerHTML=viewAdd();
  else if(tab==='cuotas')app.innerHTML=viewCuotas();
  else if(tab==='dash')app.innerHTML=viewDash();
  else app.innerHTML=viewCfg();
  wire();
  saveCache();
}

function meter(label,sp,cap,el,dim,noCap){
  if(noCap){return '<div class="meter m-ok"><div class="mh"><span class="ml">'+label+'</span><span class="mv">'+fmt(sp)+'</span></div><div class="mf" style="color:var(--muted)">Sin tope · se registra para la trazabilidad</div></div>';}
  const r=cap>0?sp/cap:0, pace=el?(sp/el)*dim:sp;
  let c='m-ok',f='Quedan '+fmt(cap-sp);
  if(r>1){c='m-over';f='Te pasaste '+fmt(sp-cap);}
  else if(r>=.75){c='m-warn';f='Quedan '+fmt(cap-sp)+' · al ritmo actual cerrás en '+fmt(pace);}
  return '<div class="meter '+c+'"><div class="mh"><span class="ml">'+label+'</span><span class="mv">'+fmt(sp)+' / '+fmt(cap)+'</span></div><div class="track"><div class="fill" style="width:'+Math.min(r*100,100).toFixed(1)+'%"></div></div><div class="mf">'+f+'</div></div>';
}

function viewBoard(){
  const s=summary;if(!s)return'';
  const g=s.gastos,t=s.topes,el=s.elapsed,dim=s.dim;
  let ban='';
  if(g.comerL>t.comerL)ban+='<div class="banner b-red">🔴 Lautaro pasó el tope de comer afuera ('+fmt(g.comerL)+' / '+fmt(t.comerL)+')</div>';
  if(g.comerV>t.comerV)ban+='<div class="banner b-red">🔴 Vanessa pasó el tope de comer afuera ('+fmt(g.comerV)+' / '+fmt(t.comerV)+')</div>';
  if(g.superT>t.super)ban+='<div class="banner b-red">🔴 El súper pasó el tope del hogar</div>';
  const pc=v=>v>=0?'pos':'neg';
  const projLine=w=>{ if(!s.isCur||!s.savingsProj||s.savingsProj[w]===undefined) return '';
    const p=s.savingsProj[w]; return '<div class="proj">Proyectado fin de mes <b class="'+pc(p)+'">'+fmt(p)+'</b></div>'; };
  const ex=(s.expenses||[]).slice().reverse().slice(0,10);
  const list=ex.length?ex.map(e=>'<div class="xrow"><span class="dot" style="background:'+(cc(e.cat))+'"></span><span class="d">'+e.cat+'<small>'+e.quien+' · '+e.medio+(e.nota?' · '+e.nota:'')+' · '+e.date.slice(8,10)+'/'+e.date.slice(5,7)+'</small></span><span class="a">'+fmt(e.monto)+'</span><button class="x" data-del="'+e.id+'">×</button></div>').join(''):'<div class="empty">Sin gastos este mes. Tocá <b>Cargar</b>.</div>';
  return ban
  +'<div class="card"><div class="eyebrow">Ahorro real · '+labelYM(curYM)+'</div><div class="sgrid" style="margin-top:8px">'
  +'<div class="pill"><div class="who">Lautaro</div><div class="big '+pc(s.savings.L)+'">'+fmt(s.savings.L)+'</div><div class="sub '+pc(s.savings.L)+'">'+pctf(s.pct.L)+' del sueldo</div>'+projLine('L')+'</div>'
  +'<div class="pill"><div class="who">Vanessa</div><div class="big '+pc(s.savings.V)+'">'+fmt(s.savings.V)+'</div><div class="sub '+pc(s.savings.V)+'">'+pctf(s.pct.V)+' del sueldo</div>'+projLine('V')+'</div></div>'
  +'<div class="hint">Ahorro de caja hasta hoy: ingreso − fijos − tarjetas − gastos por fuera de tarjeta. El <b>proyectado</b> estima el cierre del mes al ritmo de gasto actual. Día '+el+' de '+dim+'.</div></div>'
  +tarjetasCard(s)
  +'<div class="card"><div class="ct">Comer afuera + delivery</div><div class="tag">Tope dinámico: '+pctf((s.config.pct_comer||8)/100)+' del ingreso de cada uno</div>'
  +meter('Lautaro',g.comerL,t.comerL,el,dim)+meter('Vanessa',g.comerV,t.comerV,el,dim)+'</div>'
  +'<div class="card"><div class="ct">Salidas</div>'+meter('Lautaro',g.salidasL,t.salidasL,el,dim)+meter('Vanessa',g.salidasV,t.salidasV,el,dim)+'</div>'
  +'<div class="card"><div class="ct">Súper del hogar</div>'+meter('Entre los dos',g.superT,t.super,el,dim)
  +'<div class="hint">Se reparte '+pctf(s.sL)+' / '+pctf(s.sV)+' · L '+fmt(g.superT*s.sL)+' · V '+fmt(g.superT*s.sV)+'</div></div>'
  +'<div class="card"><div class="ct">Otros gastos del mes (sin tope)</div>'+noCapList(g.noCap)+'</div>'
  +fijosCards(s)
  +'<div class="card"><div class="ct">Últimos movimientos</div>'+list+'</div>';
}
function noCapList(m){ if(!m) return '<div class="empty" style="padding:14px">Sin gastos todavía.</div>'; const ks=Object.keys(m).filter(k=>m[k]>0); if(!ks.length) return '<div class="empty" style="padding:14px">Sin gastos en estas categorías todavía.</div>'; return ks.map(k=>'<div class="xrow"><span class="dot" style="background:'+cc(k)+'"></span><span class="d">'+k+'</span><span class="a">'+fmt(m[k])+'</span></div>').join(''); }
function tarjetasCard(s){ const t=s.tarjetas||{L:0,V:0}; const tot=(t.L||0)+(t.V||0);
  if(tot<=0) return '<div class="card"><div class="ct">Pago de tarjetas del mes</div><div class="hint">Cargá el total de cada resumen en la pestaña Mes. Es lo que efectivamente pagás e impacta directo en el ahorro.</div></div>';
  return '<div class="card"><div class="ct">Pago de tarjetas del mes</div><div class="sgrid" style="margin-top:6px">'
    +'<div class="pill"><div class="who">Lautaro</div><div class="big">'+fmt(t.L)+'</div></div>'
    +'<div class="pill"><div class="who">Vanessa</div><div class="big">'+fmt(t.V)+'</div></div></div>'
    +'<div class="hint">Total '+fmt(tot)+' · incluye cuotas, suscripciones y consumos del resumen.</div></div>'; }
function fijoRow(f){
  return '<div class="frow'+(f.paid?' paid':'')+'"><button class="chk" data-pay="'+f.id+'" data-paid="'+(f.paid?1:0)+'">'+(f.paid?'✓':'')+'</button>'
   +'<span class="fd">'+f.nombre+'<small>'+f.quien+(f.dia?' · vence día '+f.dia:'')+'</small></span>'
   +'<span class="fa">'+fmt(f.monto)+'</span></div>';
}
function fijosCards(s){
  const fd=s.fijosData; if(!fd) return '';
  const blk=(titulo,arr)=>{ if(!arr||!arr.length) return '';
    const tot=arr.reduce((a,f)=>a+f.monto,0), pag=arr.filter(f=>f.paid).reduce((a,f)=>a+f.monto,0);
    return '<div class="card"><div class="ct">'+titulo+'</div>'+arr.map(fijoRow).join('')
      +'<div class="ftot">Pagado '+fmt(pag)+' · Pendiente '+fmt(tot-pag)+'</div></div>'; };
  return blk('Gastos del hogar', fd.hogar) + blk('Fijos personales', [].concat(fd.persL||[],fd.persV||[]));
}

// Fijos de una persona ('L'|'V'|'Ambos'), respetando el reparto sL/sV de los 'Ambos'
function fijosDetalle(who){
  const s=summary; if(!s||!s.fijosData) return [];
  const fd=s.fijosData, sL=s.sL||0.7625, out=[];
  [].concat(fd.hogar||[],fd.persL||[],fd.persV||[]).forEach(f=>{
    if(f.quien==='Ambos'){
      if(who==='Ambos') out.push({nombre:f.nombre,monto:f.monto,paid:f.paid});
      else out.push({nombre:f.nombre+' (tu parte)',monto:Math.round(who==='L'?f.monto*sL:f.monto*(1-sL)),paid:f.paid});
    } else if(who==='Ambos'){
      out.push({nombre:f.nombre+' ('+f.quien+')',monto:f.monto,paid:f.paid});
    } else if((who==='L'&&f.quien==='Lautaro')||(who==='V'&&f.quien==='Vanessa')){
      out.push({nombre:f.nombre,monto:f.monto,paid:f.paid});
    }
  });
  return out;
}

function viewDash(){
  const d=dash;if(!d)return '<div class="card"><div class="spin"></div></div>';
  const s=summary||{};
  const who=dashWho;                       // 'L' | 'V' | 'Ambos'
  const isB=who==='Ambos';
  const nombreW=isB?'Ambos':(who==='L'?'Lautaro':'Vanessa');
  const pick=(l,v)=> isB?(l+v):(who==='L'?l:v);

  // ---- Ahorro del hogar (se mantiene como contexto) ----
  const serie=d.series||[];
  const cur=serie[serie.length-1]||{ahorroReal:0};
  const pEstim=d.ingresoTotal?d.ahorroEstim/d.ingresoTotal:0;
  const pReal=d.ingresoTotal?cur.ahorroReal/d.ingresoTotal:0;
  let html='<div class="card"><div class="eyebrow">Ahorro del hogar · '+labelYM(curYM)+'</div><div class="sgrid" style="margin-top:8px">'
  +'<div class="pill"><div class="who">Estimado (techo)</div><div class="big pos">'+fmt(d.ahorroEstim)+'</div><div class="sub pos">'+pctf(pEstim)+'</div></div>'
  +'<div class="pill"><div class="who">Real</div><div class="big '+(cur.ahorroReal>=0?'pos':'neg')+'">'+fmt(cur.ahorroReal)+'</div><div class="sub '+(cur.ahorroReal>=0?'pos':'neg')+'">'+pctf(pReal)+'</div></div></div>'
  +'<div class="hint">"Estimado" = ingreso − fijos − cuotas (antes del gasto variable). "Real" descuenta lo que efectivamente gastaron.</div></div>';

  // ---- Selector de persona ----
  const segBtn=(val,lab)=>'<button data-dwho="'+val+'" class="'+(who===val?'on':'')+'">'+lab+'</button>';
  html+='<div class="card"><div class="ct">Detalle individual · '+labelYM(curYM)+'</div>'
    +'<div class="seg" style="margin-bottom:4px">'+segBtn('L','Lautaro')+segBtn('V','Vanessa')+segBtn('Ambos','Ambos')+'</div>';

  // Ingreso / ahorro real de la persona
  const ingreso=pick((s.income&&s.income.L)||0,(s.income&&s.income.V)||0);
  const ahorro =pick((s.savings&&s.savings.L)||0,(s.savings&&s.savings.V)||0);
  const tarjeta=pick((s.tarjetas&&s.tarjetas.L)||0,(s.tarjetas&&s.tarjetas.V)||0);
  const fijos  =pick((s.fijos&&s.fijos.L)||0,(s.fijos&&s.fijos.V)||0);
  html+='<div class="sgrid" style="margin:8px 0">'
    +'<div class="pill"><div class="who">Ingreso</div><div class="big">'+fmt(ingreso)+'</div></div>'
    +'<div class="pill"><div class="who">Ahorro real</div><div class="big '+(ahorro>=0?'pos':'neg')+'">'+fmt(ahorro)+'</div></div></div>';

  // Gasto variable por categoría (de los movimientos del mes)
  const exps=(s.expenses||[]).filter(e=> isB?true:(who==='L'?e.quien==='Lautaro':e.quien==='Vanessa'));
  const catOrder=['Comer afuera','Delivery','Súper','Salidas','Combustible','Agua','Viajes','Gastos personales','Ropa','Otros'];
  const byCat={}; exps.forEach(e=>{ byCat[e.cat]=(byCat[e.cat]||0)+(+e.monto||0); });
  const catRows=catOrder.filter(c=>byCat[c]>0);
  const varTot=catRows.reduce((a,c)=>a+byCat[c],0);
  const maxC=Math.max(1,...catRows.map(c=>byCat[c]));
  const catHTML=catRows.length? catRows.map(c=>'<div class="catbar"><div class="top"><span>'+c+'</span><span>'+fmt(byCat[c])+'</span></div><div class="tr"><div class="fl" style="width:'+(byCat[c]/maxC*100)+'%;background:'+cc(c)+'"></div></div></div>').join('') : '<div class="empty" style="padding:14px">Sin gasto variable este mes.</div>';
  html+='<div class="blk">Gasto variable por categoría</div>'+catHTML+'<div class="ftot">Subtotal variable '+fmt(varTot)+'</div>';

  // Fijos de la persona
  const fList=fijosDetalle(who);
  const fijHTML=fList.length? fList.map(f=>'<div class="xrow"><span class="d">'+f.nombre+(f.paid?' <small style="color:var(--pine);font-weight:700">✓ pago</small>':'')+'</span><span class="a">'+fmt(f.monto)+'</span></div>').join('') : '<div class="empty" style="padding:14px">Sin fijos.</div>';
  html+='<div class="blk">Fijos</div>'+fijHTML+'<div class="ftot">Subtotal fijos '+fmt(fijos)+'</div>';

  // Tarjeta a pagar
  html+='<div class="blk">Tarjeta a pagar</div><div class="xrow"><span class="d">Total del resumen del mes</span><span class="a">'+fmt(tarjeta)+'</span></div>';
  html+='</div>'; // cierra card detalle

  // ---- Evolución 6 meses: gasto y ahorro (dos grupos de barras) ----
  const sp=d.seriesP||[];
  if(sp.length){
    const gv=x=> isB?(x.gL+x.gV):(who==='L'?x.gL:x.gV);
    const av=x=> isB?(x.aL+x.aV):(who==='L'?x.aL:x.aV);
    const maxB=Math.max(1,...sp.map(x=>Math.max(gv(x),Math.max(av(x),0))));
    const cols=sp.map(x=>{ const M=+x.mes.split('-')[1]; const g=gv(x),a=av(x);
      const hg=Math.round(Math.max(0,g)/maxB*110), ha=Math.round(Math.max(0,a)/maxB*110);
      return '<div class="gcol"><div class="pair">'
        +'<div class="b g" style="height:'+hg+'px" title="Gasto '+fmt(g)+'"></div>'
        +'<div class="b a" style="height:'+ha+'px" title="Ahorro '+fmt(a)+'"></div></div>'
        +'<div class="lab">'+MONTHS[M-1].slice(0,3)+'</div></div>'; }).join('');
    html+='<div class="card"><div class="ct">Últimos 6 meses · '+nombreW+'</div>'
      +'<div class="legend"><span><i class="sw g"></i>Gasto</span><span><i class="sw a"></i>Ahorro</span></div>'
      +'<div class="gbars">'+cols+'</div>'
      +'<div class="hint">Gasto = lo gastado en el mes (todo medio). Ahorro = ingreso − fijos − tarjetas − gasto por fuera de tarjeta. Fijos, tarjetas e ingreso se toman con los valores actuales de configuración.</div></div>';
  }
  return html;
}

function viewCfg(){
  const s=summary,c=(s&&s.config)||{};
  const v=k=>c[k]!==undefined?c[k]:'';
  const row=(k,lab,hint,plain)=>{const val=plain?v(k):fmtNum(v(k));const oi=plain?'':' oninput="this.value=fmtNum(this.value)"';return '<div class="cfgrow"><span class="k">'+lab+(hint?'<small>'+hint+'</small>':'')+'</span><input class="ci" onfocus="this.select()"'+oi+' data-key="'+k+'" inputmode="decimal" value="'+val+'"></div>';};
  const sel=(k,lab,opts)=>{const cur=String(v(k));return '<div class="cfgrow"><span class="k">'+lab+'</span><select class="cs" data-key="'+k+'">'+opts.map(o=>'<option value="'+o[0]+'"'+(cur===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select></div>';};
  const fd=(s&&s.fijosData)||{hogar:[],persL:[],persV:[]};
  const allF=[].concat(fd.hogar||[],fd.persL||[],fd.persV||[]).sort((a,b)=>(a.id||0)-(b.id||0));
  const opt=(list,cur)=>list.map(o=>'<option'+(o===cur?' selected':'')+'>'+o+'</option>').join('');
  const fijoEdit=f=>'<div class="fijoedit" data-fid="'+f.id+'">'
    +'<input class="fe-nombre" onfocus="this.select()" value="'+(f.nombre||'')+'">'
    +'<div class="fe-line"><input class="fe-monto" onfocus="this.select()" oninput="this.value=fmtNum(this.value)" inputmode="decimal" value="'+fmtNum(f.monto)+'" placeholder="$">'
    +'<input class="fe-dia" onfocus="this.select()" inputmode="numeric" value="'+(f.dia||'')+'" placeholder="día">'

    +'<div class="fe-line"><select class="fe-quien">'+opt(['Lautaro','Vanessa','Ambos'],f.quien)+'</select>'

  return '<div class="card"><div class="eyebrow">Configuración de '+labelYM(curYM)+'</div>'
  +'<div class="hint">Actualizá lo que cambió este mes. Al guardar se aplican los ingresos, topes, reportes y los cambios en los fijos.</div>'
  +'<div class="blk">Ingresos del mes</div>'+row('incomeL','Sueldo Lautaro')+row('incomeV','Sueldo Vanessa')+'<div class="blk">Tarjetas a pagar este mes</div>'+row('tarjetas_L','Tarjetas Lautaro','total del resumen')+row('tarjetas_V','Tarjetas Vanessa','total del resumen')
  +'<div class="blk">Topes variables (dinámicos)</div>'
  +row('pct_comer','Comer afuera (% ingreso)','sugerido 8–10%',true)+row('pct_salidas','Salidas (% ingreso)','sugerido 5%',true)
  +'<div class="cfgrow"><span class="k">Súper del hogar<small>'+(s&&s.superSug?('sugerido '+fmt(s.superSug)+' · prom. 3 meses'):'sin historial aún')+'</small></span><input class="ci" onfocus="this.select()" oninput="this.value=fmtNum(this.value)" data-key="cap_super" inputmode="decimal" value="'+fmtNum(v('cap_super'))+'"></div>'
  +(s&&s.superSug?'<div class="suggest" id="useSug">↳ usar sugerencia '+fmt(s.superSug)+'</div>':'')
  +'<div class="blk">Reportes por mail</div>'
  +sel('rep_pagos','Aviso de pagos',[['off','No enviar'],['dia','El día del vencimiento'],['previo','El día anterior']])
  +sel('rep_resumen','Resumen completo',[['off','No enviar'],['semanal','Semanal (lunes)'],['mensual','Mensual (día 1)']])
  +'</div>'
  +'<div class="card" style="margin-bottom:80px"><div class="eyebrow">Gastos fijos</div>'
  +'<div class="hint">Editá nombre, monto, quién paga, tipo y día de vencimiento. El día alimenta los avisos de pago.</div>'
  +'<div style="margin-top:10px">'+(allF.length?allF.map(fijoEdit).join(''):'<div class="empty">Sin fijos. Agregá el primero.</div>')+'</div>'
  +'<button class="btn ghost" id="bAddFijo">+ Agregar gasto fijo</button></div>'
  +'<div class="savebar"><button class="btn" id="bCfg">Guardar el mes</button></div>';
}

function wire(){
  document.querySelectorAll('[data-dwho]').forEach(b=>b.onclick=()=>{dashWho=b.dataset.dwho;render();});
  document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{draft.cat=b.dataset.c;render();});
  document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{draft.quien=b.dataset.w;render();});
  document.querySelectorAll('[data-cw]').forEach(b=>b.onclick=()=>{cdraft.quien=b.dataset.cw;render();});
  const amt=document.getElementById('iAmt'); if(amt)amt.oninput=e=>draft.monto=e.target.value;
  const bAdd=document.getElementById('bAdd'); if(bAdd)bAdd.onclick=()=>{
    if(Date.now()-lastSave<900) return;        // anti doble-toque (evita duplicados)
    const m=parseNum(document.getElementById('iAmt').value);
    if(!m||m<=0){document.getElementById('iAmt').focus();return;}
    lastSave=Date.now();
    draft.cat=document.getElementById('iCat').value;draft.medio=document.getElementById('iMedio').value;draft.fecha=document.getElementById('iFecha').value;draft.nota=document.getElementById('iNota').value.trim();
    post({action:'save',monto:m,cat:draft.cat,quien:draft.quien,medio:draft.medio,fecha:draft.fecha,nota:draft.nota});
    if(summary&&summary.expenses&&draft.fecha.slice(0,7)===curYM){
      summary.expenses.push({id:'t'+Date.now(),date:draft.fecha,quien:draft.quien,cat:draft.cat,medio:draft.medio,monto:m,nota:draft.nota});
      recompute();
    }
    toast('✓ '+fmt(m)+' · '+draft.cat);
    draft.monto='';draft.nota='';   // se queda en Cargar; NO hace focus (no abre teclado) NI relee (no borra)
    render();
  };
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(!confirm('¿Eliminar gasto?'))return;post({action:'delete',id:b.dataset.del});if(summary&&summary.expenses){summary.expenses=summary.expenses.filter(e=>String(e.id)!==String(b.dataset.del));recompute();}render();});
  document.querySelectorAll('[data-delc]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Eliminar esta cuota?'))return;await post({action:'deleteCuota',id:b.dataset.delc});cuotas=await api({action:'cuotas',ym:curYM});render();});
  const bC=document.getElementById('bCuota'); if(bC)bC.onclick=async()=>{
    cdraft.descripcion=document.getElementById('cDesc').value.trim();
    cdraft.cuota_mensual=parseNum(document.getElementById('cCuota').value);
    cdraft.n_cuotas=parseInt(document.getElementById('cN').value);cdraft.mes_inicio=document.getElementById('cIni').value;
    if(!cdraft.cuota_mensual||!cdraft.n_cuotas){alert('Completá cuota y cantidad');return;}
    bC.textContent='Guardando…';
    await post({action:'addCuota',descripcion:cdraft.descripcion,quien:cdraft.quien,cuota_mensual:cdraft.cuota_mensual,n_cuotas:cdraft.n_cuotas,mes_inicio:cdraft.mes_inicio});
    cdraft={descripcion:'',quien:'Lautaro',cuota_mensual:'',n_cuotas:'',mes_inicio:curYM};
    cuotas=await api({action:'cuotas',ym:curYM});dash=null;render();
  };
  const us=document.getElementById('useSug'); if(us)us.onclick=()=>{document.querySelector('[data-key="cap_super"]').value=fmtNum(summary.superSug);};
  // toggle de pagado (Tablero)
  document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.pay, wasPaid=b.dataset.paid==='1';
    post({action: wasPaid?'quitarPago':'marcarPago', fijoId:id, mes:curYM});
    if(summary&&summary.fijosData){ const upd=f=>{if(String(f.id)===String(id))f.paid=!wasPaid;};
      (summary.fijosData.hogar||[]).forEach(upd);(summary.fijosData.persL||[]).forEach(upd);(summary.fijosData.persV||[]).forEach(upd); }
    dash=null; render();
  });
  // agregar fijo
  const bAF=document.getElementById('bAddFijo'); if(bAF)bAF.onclick=async()=>{
    bAF.textContent='Agregando…'; post({action:'addFijo',nombre:'Nuevo gasto',monto:0,quien:'Lautaro',tipo:'Personal',dia:1});
    setTimeout(async()=>{ summary=await api({action:'summary',ym:curYM}); render(); }, 1200);
  };
  // borrar fijo
  document.querySelectorAll('[data-delf]').forEach(b=>b.onclick=async()=>{ if(!confirm('¿Eliminar este gasto fijo?'))return;
    post({action:'deleteFijo',id:b.dataset.delf}); setTimeout(async()=>{ summary=await api({action:'summary',ym:curYM}); render(); }, 1000); });
  const bCfg=document.getElementById('bCfg'); if(bCfg)bCfg.onclick=async()=>{
    const up={};
    document.querySelectorAll('.ci').forEach(i=>{if(i.value!=='')up[i.dataset.key]=parseNum(i.value);});
    document.querySelectorAll('.cs').forEach(i=>{up[i.dataset.key]=i.value;});
    // guardar cambios de cada fijo
    document.querySelectorAll('.fijoedit').forEach(fe=>{
      post({action:'updateFijo', id:fe.dataset.fid,
        nombre:fe.querySelector('.fe-nombre').value,
        monto:parseNum(fe.querySelector('.fe-monto').value),
        dia:parseInt(fe.querySelector('.fe-dia').value)||0,
        quien:fe.querySelector('.fe-quien').value,
        tipo:fe.querySelector('.fe-tipo').value });
    });
    bCfg.textContent='Guardando…';post({action:'saveConfig',updates:up});toast('✓ Mes guardado');dash=null;reconciliar(1800);
  };
}
loadAll();
</script>
